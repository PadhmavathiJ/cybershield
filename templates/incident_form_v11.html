{% extends 'base.html' %}{% block title %}Create incident · CyberShield SOC{% endblock %}{% block heading %}Create incident{% endblock %}{% block content %}<section class="soc-page"><div class="soc-page-head"><div><p class="eyebrow">CASE INTAKE</p><h1>Open an incident</h1><p class="muted">Select an alert and provide a concise case summary.</p></div></div><form class="soc-form" method="post" action="{{ url_for('new_incident') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is callable else csrf_token }}"><label>Alert<select name="alert_id" required><option value="">Select an unlinked alert</option>{% for a in available_alerts|default([]) %}<option value="{{ a.alert_id }}" {% if request.args.get('alert_id')|string == a.alert_id|string %}selected{% endif %}>#{{ a.alert_id }} · {{ a.severity }} · {{ a.status }}</option>{% endfor %}</select></label><label>Title<input name="title" maxlength="200" required value="{{ form.title if form else '' }}"></label><label>Description<textarea name="description" rows="4">{{ form.description if form else '' }}</textarea></label><label>Severity<select name="severity" required><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></label><label>Campaign (optional)<select name="campaign_id"><option value="">No campaign</option>{% for c in campaigns|default([]) %}<option value="{{ c.campaign_id }}">{{ c.name }}</option>{% endfor %}</select></label><div class="form-actions"><button class="btn primary" type="submit">Create incident</button></div></form></section>{% endblock %}
